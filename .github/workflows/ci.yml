name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.lock

      - name: Run pytest
        run: python -m pytest backend/tests -q

  frontend:
    name: Frontend (typecheck + build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 与 release.yml 同步使用 Node 22 LTS：测试通过版本必须等于发布版本，
          # 避免 CI 绿但 release build 红的版本漂移；22 原生支持 type-stripping，
          # 与 desktop job 共用同一约束。
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Build
        run: npm --prefix frontend run build

      - name: Source-level tests
        run: |
          cd frontend
          node --test tests/*.test.ts

  desktop:
    name: Desktop (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 与 release.yml 同步使用 Node 22 LTS：测试通过版本必须等于发布版本；
          # release 流水线 make-macos-release.mjs 通过 type-stripping 加载
          # forge.config.ts，22 原生支持，20 会报 "Unknown file extension .ts"。
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm --prefix desktop ci

      - name: Typecheck
        run: npm --prefix desktop run typecheck

      - name: Source-level tests
        run: node --test desktop/tests/*.test.ts
