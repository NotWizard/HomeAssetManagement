name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag（必填，如 v0.2.0）；workflow 不会自动打 tag，仅基于该名字 build 并 create release / Required tag name (e.g. v0.2.0); the workflow does not create the tag, only builds and publishes the release under this name.'
        required: true
        type: string
      release_mode:
        description: 'macOS 发布模式：developer-id 需要 Apple Developer 凭据；unsigned 使用 ad-hoc 签名，仅解决包结构损坏问题。'
        required: true
        default: developer-id
        type: choice
        options:
          - developer-id
          - unsigned

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos-arm64:
    name: Build macOS arm64 DMG/ZIP
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # tag push 触发时仓库还没配 Apple 证书 secrets，默认就走 unsigned；如果未来要发
      # signed 版本，用 workflow_dispatch 并把 release_mode 选成 developer-id 即可。
      # 把默认从 developer-id 改成 unsigned 是因为 v0.3.1 重新 tag 触发时全套 secrets
      # 仍为空，老默认值直接让 make:dmg 在 "缺少 macOS 发布签名配置" 处 exit 1，
      # release 始终建不出来。
      HBS_MACOS_RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_mode || 'unsigned' }}
      HBS_MACOS_CODESIGN_IDENTITY: ${{ secrets.HBS_MACOS_CODESIGN_IDENTITY }}
      HBS_MACOS_CODESIGN_KEYCHAIN: ${{ secrets.HBS_MACOS_CODESIGN_KEYCHAIN }}
      HBS_MACOS_NOTARY_APPLE_ID: ${{ secrets.HBS_MACOS_NOTARY_APPLE_ID }}
      HBS_MACOS_NOTARY_APPLE_ID_PASSWORD: ${{ secrets.HBS_MACOS_NOTARY_APPLE_ID_PASSWORD }}
      HBS_MACOS_NOTARY_TEAM_ID: ${{ secrets.HBS_MACOS_NOTARY_TEAM_ID }}
      HBS_MACOS_NOTARY_KEYCHAIN_PROFILE: ${{ secrets.HBS_MACOS_NOTARY_KEYCHAIN_PROFILE }}
      HBS_MACOS_NOTARY_KEYCHAIN: ${{ secrets.HBS_MACOS_NOTARY_KEYCHAIN }}
      HBS_MACOS_NOTARY_API_KEY: ${{ secrets.HBS_MACOS_NOTARY_API_KEY }}
      HBS_MACOS_NOTARY_API_KEY_ID: ${{ secrets.HBS_MACOS_NOTARY_API_KEY_ID }}
      HBS_MACOS_NOTARY_API_ISSUER: ${{ secrets.HBS_MACOS_NOTARY_API_ISSUER }}
      HBS_MACOS_CERTIFICATE_P12: ${{ secrets.HBS_MACOS_CERTIFICATE_P12 }}
      HBS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.HBS_MACOS_CERTIFICATE_PASSWORD }}
      HBS_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.HBS_MACOS_KEYCHAIN_PASSWORD }}
    outputs:
      release_tag: ${{ steps.resolve_tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # 缓存 pip download cache（macOS 下为 ~/Library/Caches/pip）。
          # setup-python 内部 hashFiles(cache-dependency-path) 做 key，
          # 与 ci.yml backend job 同模式，避免每次 release 都重下依赖。
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS 原生支持 type-stripping，能让 make-macos-release.mjs 里
          # `await import('../forge.config.ts')` 直接加载 TS 文件（去掉类型）；
          # 20 跑会报 "Unknown file extension .ts"。
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Assert tag matches package versions
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          DESKTOP_VERSION="$(node -p "require('./desktop/package.json').version")"
          FRONTEND_VERSION="$(node -p "require('./frontend/package.json').version")"
          BACKEND_VERSION="$(sed -n 's/^    app_version: str = "\(.*\)"$/\1/p' backend/app/core/config.py)"
          if [ -z "$BACKEND_VERSION" ]; then
            echo "::error::无法从 backend/app/core/config.py 解析 app_version"
            exit 1
          fi
          # 更新器按 tag 版本拼资产名，产物名却取自 package.json：一旦发 tag 忘 bump
          # 版本号，产物名与更新器期望不符，更新静默失效且无任何报错。这里 fail fast。
          if [ "$TAG" != "v$DESKTOP_VERSION" ] || [ "$DESKTOP_VERSION" != "$FRONTEND_VERSION" ] || [ "$DESKTOP_VERSION" != "$BACKEND_VERSION" ]; then
            echo "::error::版本不一致：tag=$TAG desktop=$DESKTOP_VERSION frontend=$FRONTEND_VERSION backend=$BACKEND_VERSION"
            exit 1
          fi
          echo "版本一致性校验通过：$TAG == $DESKTOP_VERSION（desktop/frontend/backend 三端一致）"

      - name: Install backend (desktop) deps into .venv
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r backend/requirements-desktop.txt

      - name: Install frontend deps
        run: npm --prefix frontend ci

      - name: Install desktop deps
        run: npm --prefix desktop ci

      - name: Cache PyInstaller bytecode
        uses: actions/cache@v4
        with:
          # backend/build_desktop.py 把 PYINSTALLER_CONFIG_DIR 指到
          # backend/.pyinstaller/<arch>/，存 PyInstaller 解析/编译产物的
          # bytecode cache。命中后冷打包阶段省一次完整 import-graph 计算。
          path: backend/.pyinstaller
          key: pyinstaller-${{ runner.os }}-${{ hashFiles('backend/requirements-desktop.txt', 'backend/build_desktop.py') }}
          restore-keys: |
            pyinstaller-${{ runner.os }}-

      - name: Import Developer ID certificate
        if: ${{ env.HBS_MACOS_CERTIFICATE_P12 != '' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${HBS_MACOS_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::HBS_MACOS_CERTIFICATE_PASSWORD secret is required when HBS_MACOS_CERTIFICATE_P12 is set"
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/hbs-signing.keychain-db"
          KEYCHAIN_PASSWORD="${HBS_MACOS_KEYCHAIN_PASSWORD:-$(uuidgen)}"
          CERTIFICATE_PATH="$RUNNER_TEMP/hbs-macos-cert.p12"

          if ! printf '%s' "$HBS_MACOS_CERTIFICATE_P12" | base64 --decode > "$CERTIFICATE_PATH" 2>/dev/null; then
            printf '%s' "$HBS_MACOS_CERTIFICATE_P12" | base64 -D > "$CERTIFICATE_PATH"
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/hbs-macos-cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$HBS_MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          EXISTING_KEYCHAINS="$(security list-keychains -d user | tr -d '"' || true)"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS

          if [ -z "${HBS_MACOS_CODESIGN_IDENTITY:-}" ]; then
            HBS_MACOS_CODESIGN_IDENTITY="$(
              security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
                awk -F '"' '/Developer ID Application/ { print $2; exit }'
            )"
            if [ -z "$HBS_MACOS_CODESIGN_IDENTITY" ]; then
              echo "::error::No Developer ID Application identity was found in HBS_MACOS_CERTIFICATE_P12"
              exit 1
            fi
            echo "HBS_MACOS_CODESIGN_IDENTITY=$HBS_MACOS_CODESIGN_IDENTITY" >> "$GITHUB_ENV"
          fi
          echo "HBS_MACOS_CODESIGN_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERTIFICATE_PATH"

      - name: Build DMG + ZIP (arm64)
        run: npm --prefix desktop run make:dmg:arm64

      - name: List release artifacts
        run: ls -lh desktop/out/release/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: desktop/out/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Delete signing keychain
        if: ${{ always() && env.HBS_MACOS_CERTIFICATE_P12 != '' }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/hbs-signing.keychain-db" || true

  publish-release:
    name: Publish GitHub release
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download macOS arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: release-assets

      - name: List downloaded assets
        run: ls -lh release-assets/

      - name: Extract CHANGELOG section for tag
        id: changelog
        env:
          TAG: ${{ needs.build-macos-arm64.outputs.release_tag }}
        run: |
          VERSION="${TAG#v}"
          {
            echo "body<<__EOF__"
            awk -v ver="$VERSION" '
              $0 ~ "^## \\[" ver "\\]" { found = 1; next }
              found && /^## \[/         { exit }
              found                      { print }
            ' CHANGELOG.md
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build-macos-arm64.outputs.release_tag }}
          BODY: ${{ steps.changelog.outputs.body }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading new assets (--clobber)"
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --notes "$BODY"
          fi
